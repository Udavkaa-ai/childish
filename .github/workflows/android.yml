name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи из секретов (если задан)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/family.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/family.jks" >> "$GITHUB_ENV"
            echo "Подпись: постоянный ключ семьи"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан временным ключом, обновление поверх старой версии не встанет."
          fi

      - name: Тесты и сборка APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :core:test :app:assembleRelease --stacktrace

      - name: Имя файла
        run: cp app/build/outputs/apk/release/app-release.apk "english-nika-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: english-nika-apk
          path: english-nika-*.apk

      - name: Релиз с APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: English с Никой 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: english-nika-*.apk
          body: |
            Скачайте файл `english-nika-1.0.${{ github.run_number }}.apk` на телефон и откройте его.
            Если Android спросит — разрешите установку из этого источника.
